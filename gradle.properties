org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx3g
android.experimental.enableNewResourceShrinker=true

# Monetization placeholders (replace in local.properties for real builds)
APP_ADMOB_APP_ID=ca-app-pub-xxxxxxxxxxxxxxxx~yyyyyyyyyy
ADMOB_BANNER_UNIT_ID=ca-app-pub-xxxxxxxxxxxxxxxx/zzzzzzzzzz
ADMOB_INTERSTITIAL_UNIT_ID=ca-app-pub-xxxxxxxxxxxxxxxx/aaaaaaaaaa
BILLING_MONTHLY_PRODUCT_ID=flowpulse.pro.monthly
BILLING_LIFETIME_PRODUCT_ID=flowpulse.pro.lifetime

# Network config
CERTIFICATE_PIN_SHA256=sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
DEFAULT_INSTANCE_LIMIT_FREE=1
DEFAULT_POLL_INTERVAL_MINUTES=30
ALLOW_HTTP_IN_DEBUG=true
